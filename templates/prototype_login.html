<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0A1324; --gold:#EEBD1B; --paper:#F6F4EF; --line:#E3DED4;
          --t1:#101828; --t2:#5B6472; --bad:#B7302A; --bad-bg:#F8E9E8; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--paper); color:var(--t1);
    font:15px/1.55 'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    padding:24px 16px;
  }
  .box { width:100%; max-width:380px; background:#fff; border:1px solid var(--line);
         border-radius:14px; padding:26px 24px; }
  .mark { width:44px; height:44px; border-radius:11px; background:var(--ink);
          display:grid; place-items:center; margin-bottom:16px; }
  .mark span { color:var(--gold); font-weight:800; font-size:.82rem; letter-spacing:.02em; }
  h1 { font-size:1.15rem; margin:0 0 4px; letter-spacing:-.02em; }
  p.sub { margin:0 0 20px; font-size:.84rem; color:var(--t2); }
  label { display:block; font-size:.7rem; font-weight:800; letter-spacing:.09em;
          text-transform:uppercase; color:var(--t2); margin-bottom:6px; }
  input {
    width:100%; font:inherit; font-size:.92rem; padding:11px 12px;
    border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--t1);
  }
  input:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(238,189,27,.2); }
  button {
    width:100%; margin-top:14px; font:inherit; font-size:.88rem; font-weight:700;
    padding:11px; border:0; border-radius:9px; background:var(--ink); color:#fff; cursor:pointer;
  }
  button:hover { background:#13203A; }
  .err { margin:0 0 16px; padding:10px 12px; border-radius:8px; font-size:.83rem;
         background:var(--bad-bg); border:1px solid #EFC9C7; color:var(--bad); }
  .foot { margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
          font-size:.76rem; color:var(--t2); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark"><span>JGI</span></div>
    <h1>Prototype access</h1>
    <p class="sub">Face and object recognition demo — Office of Academics.</p>

    {% if error %}<p class="err">{{ error }}</p>{% endif %}

    <form method="POST" action="{{ url_for('prototype_login') }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             autofocus required>
      <button type="submit">Open the prototype</button>
    </form>

    <p class="foot">
      This page is a demonstration only. It holds no attendance records, and
      signing in here does not sign you in to the admin console.
    </p>
  </div>
</body>
</html>

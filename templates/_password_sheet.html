<!-- ══ CHANGE PASSWORD ═════════════════════════════════════════ -->
<div class="oa-backdrop" id="pwBD">
  <div class="oa-sheet">
    <div class="oa-handle"></div>
    <div class="oa-sheet-title">Change password</div>
    <div class="oa-sheet-sub">Use at least 8 characters. You stay signed in on this device.</div>
    <form class="oa-sheet-body" id="pwForm" onsubmit="submitPw(event)" autocomplete="off">
      <div class="oa-field">
        <label for="pwCurrent">Current password</label>
        <input type="password" id="pwCurrent" autocomplete="current-password" required>
      </div>
      <div class="oa-field">
        <label for="pwNew">New password</label>
        <input type="password" id="pwNew" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="oa-field">
        <label for="pwAgain">New password again</label>
        <input type="password" id="pwAgain" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="oa-flash danger" id="pwErr" hidden><i class="fas fa-circle-info"></i><span></span></div>
      <button type="submit" hidden></button>
    </form>
    <div class="oa-sheet-actions">
      <button class="oa-btn oa-btn-primary" id="pwSubmit" onclick="submitPw(event)">Change password</button>
      <button class="oa-btn oa-btn-ghost" onclick="closePw()">Cancel</button>
    </div>
  </div>
</div>
